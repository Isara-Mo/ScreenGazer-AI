[project]
name = "translate-game"
version = "0.1.0"
description = "Visual novel English learning tool with OCR and AI translation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyside6>=6.7",
    "mss>=9.0",
    "pillow>=10.4",
    "pytesseract>=0.3.10",
    "openai>=1.35",
    "imagehash>=4.3.1",
    "pygetwindow>=0.0.9",
    "keyboard>=0.13.5",
    "numpy>=1.26,<2.0",
    "dashscope>=1.20.0",
    "pywin32>=306",
    "setuptools",
]

[project.optional-dependencies]
paddle = [
    "paddlepaddle>=2.6.1,<3.0",
    "paddleocr>=2.7.3,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
